name: Weekly Report

# 每周五收盘后生成追踪周报并提交回仓库（周跟踪）。
# cron 为 UTC 且高峰期会延迟；13:00 UTC = 北京周五 21:00（晚 9 点），收盘后约 5 小时缓冲充足。
# 周五照常跑，不做交易日判断；若周五休市，行情接口返回最近交易日收盘快照。
on:
  schedule:
    - cron: '0 13 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Unit tests (offline)
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

      - name: Generate report
        run: dotnet run --no-build --configuration Release --project src/Agent.Console

      - name: Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "无报告变更，跳过提交。"
          else
            git commit -m "chore(report): 追踪周报 $(date -u +%Y-%m-%d)"
            git push
          fi
